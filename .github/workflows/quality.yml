name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Reused by the release workflow so releases run the same checks.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when reused, so a release never
  # shares (and gets cancelled with) the group of a regular push run.
  group: ${{ github.workflow }}-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: make test-fuzz-smoke
        env:
          GOMAXPROCS: "2"

  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @rendis/statepro-studio-react exec stryker run --dryRunOnly
      - run: pnpm build
      - run: pnpm audit --audit-level=low
