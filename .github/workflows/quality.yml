name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Reused by the release workflow so releases run the same checks.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when reused, so a release never
  # shares (and gets cancelled with) the group of a regular push run.
  group: ${{ github.workflow }}-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -cover ./...
      - run: make test-fuzz-smoke
        env:
          GOMAXPROCS: "2"

  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.11.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @rendis/statepro-studio-react exec stryker run --dryRunOnly
      - run: pnpm build
      - run: pnpm audit --audit-level=high
