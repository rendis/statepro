name: Release

# Manual release: validates the repository, tags `main`, creates the GitHub
# release from the CHANGELOG section, and publishes the Studio packages to npm
# through npm Trusted Publishing (OIDC, no stored npm token).
#
# Each step is idempotent: an existing tag or release is kept, and package
# versions already on npm are skipped, so a failed run can be re-run safely.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v (for example 3.4.0). Must have a CHANGELOG section.
        required: true
        type: string
      target:
        description: What to release.
        required: true
        default: all
        type: choice
        options:
          - all
          - github
          - npm
      dry_run:
        description: Validate and preview only; create nothing and publish nothing.
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release workflow from main (got ${GITHUB_REF})."
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate version and CHANGELOG
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not semver without a leading v."
            exit 1
          fi
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section."
            exit 1
          fi
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  quality:
    needs: prepare
    uses: ./.github/workflows/quality.yml

  github:
    needs: [prepare, quality]
    if: inputs.target == 'all' || inputs.target == 'github'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ inputs.version }}
      DRY_RUN: ${{ inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Extract release notes
        run: |
          awk -v header="## [$VERSION]" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          compare=$(grep -F "[$VERSION]: " CHANGELOG.md | head -1 | sed 's/^[^:]*: //')
          if [ -n "$compare" ]; then
            printf '\n**Full Changelog**: %s\n' "$compare" >> "$RUNNER_TEMP/notes.md"
          fi
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::The CHANGELOG section for $VERSION is empty."
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"
      - name: Create tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists; keeping it."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "[dry run] Would tag $GITHUB_SHA as $TAG."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" "$GITHUB_SHA" -m "$TAG"
          git push origin "refs/tags/$TAG"
      - name: Create GitHub release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; keeping it."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "[dry run] Would create release $TAG with the notes above."
            exit 0
          fi
          gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag

  npm:
    needs: [prepare, quality, github]
    if: >-
      !cancelled()
      && needs.quality.result == 'success'
      && (needs.github.result == 'success' || needs.github.result == 'skipped')
      && (inputs.target == 'all' || inputs.target == 'npm')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing and provenance
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Resolve source ref
        id: source
        run: |
          # Publish exactly what was tagged; a dry run before tagging uses main.
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG" >/dev/null; then
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          elif [ "$DRY_RUN" = "true" ]; then
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Tag $TAG does not exist. Run with target 'all' or 'github' first."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.source.outputs.ref }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: studio/pnpm-lock.yaml
      - name: Use an npm that supports Trusted Publishing
        run: npm install -g npm@^11.5.1
      - name: Build Studio packages
        working-directory: studio
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Pack and publish
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          # editor-core first: the Web Component depends on it.
          for dir in studio/packages/editor-core studio/packages/web-component; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm; skipping."
              continue
            fi
            # pnpm pack rewrites workspace:* to the real version.
            tarball=$(cd "$dir" && pnpm pack --pack-destination "$RUNNER_TEMP/packages" | tail -1)
            if tar -xOzf "$tarball" package/package.json | grep -q '"workspace:'; then
              echo "::error::$name@$version still has a workspace: dependency."
              exit 1
            fi
            if [ "$DRY_RUN" = "true" ]; then
              npm publish "$tarball" --access public --dry-run
            else
              npm publish "$tarball" --access public --provenance
            fi
          done
